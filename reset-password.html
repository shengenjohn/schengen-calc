<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Travel Compliance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .password-requirements {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
            text-align: left;
        }

        .reset-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
        }

        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="logo">🔑</div>
        <h1>Set New Password</h1>
        <p class="subtitle">Choose a secure password with at least 8 characters.</p>
        
        <div id="statusMessage" class="status-message"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required>
                <div class="password-requirements">
                    <div class="requirement" id="req-length">• At least 8 characters</div>
                    <div class="requirement" id="req-uppercase">• One uppercase letter</div>
                    <div class="requirement" id="req-lowercase">• One lowercase letter</div>
                    <div class="requirement" id="req-number">• One number</div>
                    <div class="requirement" id="req-special">• One special character (!@#$%^&*)</div>
        </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            
            <button type="submit" class="reset-btn" id="resetBtn">
                Update Password
            </button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'https://auth-api.likelylad9.workers.dev';
        
        // Get reset token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');
        
        if (!resetToken) {
            document.getElementById('statusMessage').className = 'status-message status-error';
            document.getElementById('statusMessage').textContent = '❌ Invalid reset link. Please request a new password reset.';
            document.getElementById('statusMessage').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

         // ✅ Real-time password validation
        const passwordInput = document.getElementById('password');

        if (passwordInput) {
        passwordInput.addEventListener('input', function() {
        const password = this.value;
        
        console.log('Password changed:', password); // Debug line
        
        // Check requirements and update visual indicators
        const lengthEl = document.getElementById('req-length');
        const upperEl = document.getElementById('req-uppercase');
        const lowerEl = document.getElementById('req-lowercase');
        const numberEl = document.getElementById('req-number');
        const specialEl = document.getElementById('req-special');
        
        if (lengthEl) lengthEl.classList.toggle('met', password.length >= 8);
        if (upperEl) upperEl.classList.toggle('met', /[A-Z]/.test(password));
        if (lowerEl) lowerEl.classList.toggle('met', /[a-z]/.test(password));
        if (numberEl) numberEl.classList.toggle('met', /\d/.test(password));
        if (specialEl) specialEl.classList.toggle('met', /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password));
    });
} else {
    console.error('Password input not found!');
}
        
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('resetBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            // Check passwords match
            if (password !== confirmPassword) {
                statusMessage.className = 'status-message status-error';
                statusMessage.textContent = '❌ Passwords do not match';
                statusMessage.style.display = 'block';
                return;
            }
            
            // Validate password strength
            if (password.length < 8 || 
                !/[A-Z]/.test(password) || 
                !/[a-z]/.test(password) || 
                !/\d/.test(password) || 
                !/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) {
                statusMessage.className = 'status-message status-error';
                statusMessage.textContent = '❌ Password must be at least 8 characters and include uppercase, lowercase, number, and special character';
                statusMessage.style.display = 'block';
            return;
            }
            
            // Disable form
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        token: resetToken,
                        password: password 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    statusMessage.className = 'status-message status-success';
                    statusMessage.textContent = '✅ Password updated successfully! Redirecting to login...';
                    statusMessage.style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';
                    
                    // Redirect to login after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login.html?message=password-reset-success';
                    }, 3000);
                } else {
                    throw new Error(result.error || 'Failed to reset password');
                }
                
            } catch (error) {
                statusMessage.className = 'status-message status-error';
                statusMessage.textContent = '❌ ' + error.message;
                statusMessage.style.display = 'block';
                
                // Re-enable form
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
